<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found</title>
    <link rel="stylesheet" href="style.css?v=14">
    <script src="script.js" defer></script>
    <link rel="icon" type="image/png" href="images/logo.png">
    <style media="screen">
      body {
        background: var(--page-bg) url("images/bg.png") center/cover no-repeat fixed;
        color: var(--text);
        font-family: var(--body-font);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.18);
        pointer-events: none;
      }
      #message {
        position: relative;
        z-index: 1;
        background: var(--card-bg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        max-width: 360px;
        width: calc(100% - 48px);
        margin: 100px auto 16px;
        padding: 32px 24px 16px;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(10, 20, 40, 0.12);
        transform-origin: center;
        animation: popIn 600ms cubic-bezier(.2,.9,.3,1) forwards, floatY 3s ease-in-out 800ms infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        #message {
          animation: none;
        }
      }
      #message h3 { color: var(--muted); font-weight: normal; font-size: 16px; margin: 16px 0 12px; }
      #message h2 { color: #f99c28; font-weight: bold; font-size: 16px; margin: 0 0 8px; }
      #message h1 { font-family: var(--heading-font); font-size: 24px; font-weight: 600; color: var(--text); margin: 0 0 16px; }
      #message p { line-height: 140%; margin: 16px 0 24px; font-size: 14px; color: var(--muted); }
      #message a {
        display: block;
        text-align: center;
        background: rgba(11, 35, 64, 0.9);
        text-transform: uppercase;
        text-decoration: none;
        color: #efe6cf;
        padding: 16px;
        border-radius: 8px;
        font-weight: 600;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      #message a:hover, #message a:focus {
        background: #0b2340;
        transform: translateY(-2px);
      }
      #load { color: var(--muted); text-align: center; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="lang-dropdown" class="lang-dropdown">
      <button id="lang-btn" class="lang-button" aria-haspopup="listbox" aria-expanded="false">Dil</button>
      <ul id="lang-list" class="lang-list" role="listbox" aria-labelledby="lang-btn" hidden>
        <li role="option" data-lang="tr" aria-selected="false">TR</li>
        <li role="option" data-lang="en" aria-selected="false">EN</li>
      </ul>
    </div>

    <div id="message">
      <h2>404</h2>
      <h1 data-en="Page Not Found" data-tr="Sayfa Bulunamadı">Sayfa Bulunamadı</h1>
      <p data-en="The specified file was not found on this website. Please check the URL for mistakes and try again." data-tr="Aradığınız dosya bu web sitesinde bulunamadı. Lütfen URL'de yazım hatası olup olmadığını kontrol edip tekrar deneyin.">Aradığınız dosya bu web sitesinde bulunamadı. Lütfen URL'de yazım hatası olup olmadığını kontrol edip tekrar deneyin.</p>
      <a href="index.html" data-en="Back to Homepage" data-tr="Ana Sayfaya Dön">Ana Sayfaya Dön</a>
    </div>
  </body>
</html>
